<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumora: data analysis made simple</title>
  <meta name="description" content="Drop in a spreadsheet and Lumora explains your data in plain English, with automatic insights, charts and guided lessons.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/logo-64.png">
  <link rel="apple-touch-icon" href="assets/logo-192.png">
  <meta name="theme-color" content="#011132">
  <meta property="og:image" content="assets/logo-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="home-btn" class="brand" type="button" title="Back to start" hidden>
      <span class="logo" aria-hidden="true"></span><span>Lumora</span>
    </button>
    <span class="brand static"><span class="logo" aria-hidden="true"></span><span>Lumora</span></span>
    <span id="dataset-name" class="dataset-name" hidden></span>
    <div class="top-actions">
      <label class="switch" title="Show plain-English explanations throughout the app">
        <input id="learn-toggle" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
        <span>Learn mode</span>
      </label>
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button id="save-btn" class="btn" type="button" title="Download a project file you can reopen later or share" hidden>⇩ Save project</button>
      <button id="open-btn" class="btn primary" type="button">Open file</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>
  <footer id="app-footer" class="app-footer"></footer>
  <div id="update-bar" class="update-bar" role="status" hidden></div>

  <input id="file-input" type="file" accept=".csv,.tsv,.txt,.json,.lumora,.xlsx,.xlsm,.xls,text/csv,application/json" hidden>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <dialog id="dialog"></dialog>
  <div class="drop-overlay" aria-hidden="true"><div>Drop your file to analyse it</div></div>

  <noscript>Lumora needs JavaScript to run.</noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
