# Builds the installable apps:
#   - Android APK (apps/android, Capacitor)
#   - Windows installer (.exe), Mac disk image (.dmg), Linux AppImage and .deb (apps/desktop, Electron)
#
# Every run uploads them as downloadable "artifacts" on the run's page (Actions tab).
# Pushing a version tag (e.g. `git tag v0.6.0 && git push origin v0.6.0`) also publishes
# them on the repository's Releases page, where anyone can download them.
name: Apps

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Copy the web app into the Android project
        run: npm run sync
      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LUMORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMORA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMORA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('../../package.json').version")
          mkdir -p ../out
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Signed with your own key: phones can install each new version over the old one.
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumora.jks"
            export LUMORA_KEYSTORE="$RUNNER_TEMP/lumora.jks"
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../../out/Lumora-$VERSION-android.apk"
          else
            # No signing key configured: a debug-signed APK, installable for testing.
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../../out/Lumora-$VERSION-android.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lumora-android
          path: apps/out/*.apk
          if-no-files-found: error

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the installer
        env:
          # The apps are not code-signed yet (see apps/README.md).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: lumora-desktop-${{ runner.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
